<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registered Users</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px 20px;
      color: #333;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 8px;
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #ddd;
    }

    button {
      padding: 9px 13px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Registered Users</h1>
    <p>Registered usernames stored in Supabase:</p>
    <p id="status" aria-live="polite">Loading…</p>
    <div id="users"></div>
    <button id="sign-out" type="button">Sign out</button>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Use the same project values as index.html.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const usersContainer = document.getElementById("users");
    const status = document.getElementById("status");

    async function loadUsers() {
      usersContainer.replaceChildren();

      const { data: { user }, error: authError } = await supabase.auth.getUser();

      if (authError || !user) {
        status.textContent = "Please sign in first.";
        return;
      }

      const { data: profiles, error } = await supabase
        .from("profiles")
        .select("id, username")
        .order("username");

      if (error) {
        status.textContent = `Could not load users: ${error.message}`;
        return;
      }

      status.textContent = "";

      if (!profiles || profiles.length === 0) {
        usersContainer.textContent = "No registered users found.";
        return;
      }

      for (const profile of profiles) {
        const row = document.createElement("div");
        row.className = "user-row";

        const label = document.createElement("span");
        label.textContent = profile.username;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent =
          profile.id === user.id ? "Delete my profile" : "Cannot delete";
        deleteButton.disabled = profile.id !== user.id;

        deleteButton.addEventListener("click", async () => {
          if (!confirm(`Delete your profile for ${profile.username}?`)) return;

          deleteButton.disabled = true;

          const { error: deleteError } = await supabase
            .from("profiles")
            .delete()
            .eq("id", profile.id);

          if (deleteError) {
            status.textContent = `Could not delete profile: ${deleteError.message}`;
            deleteButton.disabled = false;
            return;
          }

          status.textContent = "Profile deleted.";
          await loadUsers();
        });

        row.append(label, deleteButton);
        usersContainer.appendChild(row);
      }
    }

    document.getElementById("sign-out").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    });

    loadUsers();
  </script>
</body>
</html>
