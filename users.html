<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Registered Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px 20px;
            color: #333;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid #ddd;
        }

        button {
            padding: 9px 13px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #status { min-height: 1.5em; }
    </style>
</head>
<body>
<main>
    <h1>Registered Users</h1>
    <p>Users saved by this browser’s login page appear below.</p>
    <p id="status" aria-live="polite"></p>
    <div id="users"></div>
</main>

<script>
    const usersContainer = document.getElementById("users");
    const status = document.getElementById("status");

    function loadUsers() {
        usersContainer.replaceChildren();

        try {
            const accounts = [];

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith("user_profile_")) {
                    accounts.push(key.substring("user_profile_".length));
                }
            }

            if (accounts.length === 0) {
                usersContainer.textContent =
                    "No registered users found. Register an account first using login.html.";
                return;
            }

            accounts.sort().forEach((username) => {
                const row = document.createElement("div");
                row.className = "user-row";

                const label = document.createElement("span");
                label.textContent = username;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Delete account";

                deleteButton.addEventListener("click", () => {
                    const key = "user_profile_" + username;

                    try {
                        if (localStorage.getItem(key) === null) {
                            status.textContent = "Account not found in this browser.";
                            loadUsers();
                            return;
                        }

                        localStorage.removeItem(key);

                        if (localStorage.getItem("currentUser") === username) {
                            localStorage.removeItem("currentUser");
                            localStorage.removeItem("isLoggedIn");
                        }

                        status.textContent = `Deleted account: ${username}`;
                        loadUsers();
                    } catch (error) {
                        status.textContent =
                            "Could not access browser storage: " + error.message;
                    }
                });

                row.append(label, deleteButton);
                usersContainer.appendChild(row);
            });
        } catch (error) {
            usersContainer.textContent =
                "Could not read browser storage: " + error.message;
        }
    }

    loadUsers();
</script>
</body>
</html>
