<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Job Listings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #ddd;
    }
    .details { overflow-wrap: anywhere; }
    button { padding: 8px 12px; cursor: pointer; }
    .delete {
      color: white;
      background: #c62828;
      border: 0;
      border-radius: 4px;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.5em; }
    @media (max-width: 500px) {
      .row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <h1>Manage Job Listings</h1>
  <p id="status" role="status" aria-live="polite">Loading listings…</p>
  <div id="listings"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const status = document.getElementById("status");
    const listingsContainer = document.getElementById("listings");

    async function loadListings() {
      status.textContent = "Loading listings…";
      listingsContainer.replaceChildren();

      const { data, error } = await db
        .from("job_listings")
        .select("id,job,country,region,address,created_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Could not load listings: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = "No saved listings found.";
        return;
      }

      status.textContent = "";

      for (const item of data) {
        const row = document.createElement("div");
        row.className = "row";

        const details = document.createElement("div");
        details.className = "details";

        const title = document.createElement("strong");
        title.textContent = item.job || "Untitled job";

        const location = document.createElement("div");
        location.textContent =
          [item.address, item.region, item.country].filter(Boolean).join(", ");

        details.append(title, location);

        const button = document.createElement("button");
        button.className = "delete";
        button.type = "button";
        button.textContent = "Delete";

        button.addEventListener("click", async () => {
          if (!confirm(`Delete this listing: ${item.job || "Untitled job"}?`)) {
            return;
          }

          button.disabled = true;

          const { data: deleted, error: deleteError } = await db
            .from("job_listings")
            .delete()
            .eq("id", item.id)
            .select("id");

          if (deleteError) {
            status.textContent = "Could not delete listing: " + deleteError.message;
            button.disabled = false;
            return;
          }

          if (!deleted || deleted.length === 0) {
            status.textContent =
              "No listing was deleted. Check the table's id column and Supabase DELETE policy.";
            button.disabled = false;
            return;
          }

          status.textContent = "Listing deleted.";
          await loadListings();
        });

        row.append(details, button);
        listingsContainer.appendChild(row);
      }
    }

    loadListings();
  </script>
</body>
</html>
