<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employer Workspace</title>
    <style>
        :root { color-scheme: dark; }
        body {
            max-width: 1000px; margin: 35px auto; padding: 0 20px;
            font-family: Arial, sans-serif; color: #fff; background: #111;
        }
        form, .job-group, .country-group, .region-group, .listing {
            padding: 18px; margin-bottom: 15px; border: 1px solid #555;
            border-radius: 8px; background: #1b1b1b;
        }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea {
            box-sizing: border-box; width: 100%; padding: 11px; margin-top: 5px;
            border: 1px solid #777; border-radius: 4px; color: #fff;
            background: #000; font: inherit;
        }
        input::placeholder, textarea::placeholder { color: #bbb; }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #81b5ff; outline-offset: 1px;
        }
        textarea { min-height: 130px; resize: vertical; }
        button {
            padding: 11px 17px; margin-top: 18px; border: 1px solid #888;
            border-radius: 4px; color: #fff; background: #333; cursor: pointer;
        }
        button:hover { background: #484848; }
        button:disabled { cursor: wait; opacity: .6; }
        .hint, .empty { color: #ccc; }
        .hint { margin: 6px 0 0; font-size: .9rem; }
        .message { min-height: 1.4em; color: #8fe0a3; }
        .job-group { background: #202630; }
        .country-group { margin-left: 12px; background: #191919; }
        .region-group { margin-left: 12px; background: #222; }
        .listing { margin-left: 12px; }
        .listing p { margin: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Employer Workspace</h1>
    <h2>Add a job listing which is stored for a month</h2>

    <form id="job-form">
        <label for="qualification-search">Degree or diploma</label>
        <input id="qualification-search" type="text"
               list="qualification-options" autocomplete="off"
               placeholder="Type to search degrees or diplomas" required>
        <datalist id="qualification-options"></datalist>
        <p class="hint">Type and select a qualification suggestion.</p>

        <label for="job">Related job</label>
        <select id="job" required disabled>
            <option value="">Choose a degree or diploma first</option>
        </select>

        <label for="country">Country</label>
        <select id="country" required>
            <option value="">Choose a country</option>
        </select>

        <label for="region">Region / State / Province</label>
        <select id="region" required disabled>
            <option value="">Choose a country first</option>
        </select>

        <label for="address">Address</label>
        <input id="address" required placeholder="Enter workplace address">

        <label for="telephone">Contact telephone number</label>
        <input id="telephone" type="tel" autocomplete="tel" required
               placeholder="For example: +1 555 123 4567">

        <label for="income">Income / Salary</label>
        <input id="income" required
               placeholder="For example: $60,000–$75,000 per year">

        <label for="work-hours">Work hours / schedule</label>
        <input id="work-hours" required
               placeholder="For example: Monday–Friday, 9:00 AM–5:00 PM">

        <label for="description">Job description and other details</label>
        <textarea id="description" required
                  placeholder="Describe responsibilities, requirements, benefits, and details."></textarea>

        <button id="submit-button" type="submit">Save job listing</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <h2>Saved Listings — Alphabetical Groups</h2>
    <div id="listings"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

        /*
         * INSERT YOUR COMPLETE DEGREE_JOBS OBJECT HERE.
         *
         * Copy the entire const DEGREE_JOBS = { ... }; object from your
         * original message, including every qualification and job.
         * Do not leave out entries or add a second DEGREE_JOBS declaration.
         */

        const DEGREE_JOBS = {
            "None": ["Restaurants", "Shops"],
            "Fine Art": [
                "Studio Assistant",
                "Artist’s Assistant",
                "Gallery Assistant",
                "Arts Programme Assistant",
                "Community Arts Assistant",
                "Trainee Conservator"
            ],
            "Graphic Design": [
                "Junior Graphic Designer",
                "Trainee Graphic Designer",
                "Graphic Design Assistant",
                "Junior Brand Designer",
                "Production Artist",
                "Junior Digital Designer"
            ]
            // Keep adding the rest of your original qualification/job entries here.
        };

        function compareText(a, b) {
            return a.localeCompare(b, undefined, {
                sensitivity: "base",
                numeric: true
            });
        }

        const qualificationNames = Object.keys(DEGREE_JOBS).sort(compareText);
        const qualificationSearch = document.getElementById("qualification-search");
        const qualificationOptions = document.getElementById("qualification-options");
        const jobSelect = document.getElementById("job");
        const countrySelect = document.getElementById("country");
        const regionSelect = document.getElementById("region");
        const form = document.getElementById("job-form");
        const listingsContainer = document.getElementById("listings");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "#ff9292" : "#8fe0a3";
        }

        function resetJobSelect(text) {
            jobSelect.replaceChildren(new Option(text, ""));
            jobSelect.disabled = true;
        }

        function populateQualifications() {
            qualificationOptions.replaceChildren();
            qualificationNames.forEach(name => {
                qualificationOptions.appendChild(new Option(name, name));
            });
        }

        function loadRelatedJobs(qualification) {
            const jobs = DEGREE_JOBS[qualification] || [];
            resetJobSelect(jobs.length ? "Choose a related job" : "No jobs found");

            jobs.forEach(title => jobSelect.appendChild(new Option(title, title)));
            jobSelect.disabled = jobs.length === 0;

            setMessage(
                jobs.length ? "" : "No jobs are listed for that qualification.",
                !jobs.length
            );
        }

        qualificationSearch.addEventListener("input", () => {
            const value = qualificationSearch.value.trim();
            resetJobSelect(value ? "Select a suggested qualification first" :
                                   "Choose a degree or diploma first");

            const match = qualificationNames.find(name =>
                name.toLocaleLowerCase() === value.toLocaleLowerCase()
            );

            if (match) loadRelatedJobs(match);
            else setMessage("");
        });

        [
            ["United Kingdom", "UK"],
            ["Germany", "Germany"],
            ["Singapore", "Singapore"],
            ["United States", "America"],
            ["Denmark", "Denmark"],
            ["Italy", "Italy"],
            ["Norway", "Norway"]
        ].sort((a, b) => compareText(a[1], b[1]))
         .forEach(([value, label]) => countrySelect.appendChild(new Option(label, value)));

        async function loadRegions(country) {
            regionSelect.disabled = true;
            regionSelect.replaceChildren(new Option("Loading regions…", ""));
            setMessage("");

            try {
                const response = await fetch(
                    "https://countriesnow.space/api/v0.1/countries/states",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ country })
                    }
                );

                if (!response.ok) throw new Error("Region request failed");
                const result = await response.json();
                const regions = result.data?.states || [];
                regions.sort((a, b) => compareText(a.name, b.name));

                regionSelect.replaceChildren(
                    new Option(
                        regions.length ? "Choose a region/state/province" :
                                         "No regions available",
                        ""
                    )
                );

                regions.forEach(region =>
                    regionSelect.appendChild(new Option(region.name, region.name))
                );

                regionSelect.disabled = regions.length === 0;
            } catch {
                regionSelect.replaceChildren(new Option("Could not load regions", ""));
                setMessage("Could not load regions. Check your connection and try again.", true);
            }
        }

        countrySelect.addEventListener("change", () => {
            if (countrySelect.value) loadRegions(countrySelect.value);
            else {
                regionSelect.disabled = true;
                regionSelect.replaceChildren(new Option("Choose a country first", ""));
            }
        });

        function makeGroup(title, className) {
            const section = document.createElement("section");
            section.className = className;
            const heading = document.createElement("h3");
            heading.textContent = title;
            section.appendChild(heading);
            return section;
        }

        function addDetail(container, label, value) {
            const p = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = label + ": ";
            p.append(strong, document.createTextNode(value || "Not provided"));
            container.appendChild(p);
        }

        async function fetchActiveListings() {
            const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();
            const { data, error } = await db
                .from("job_listings")
                .select("*")
                .gte("created_at", cutoff)
                .order("job", { ascending: true });

            if (error) throw error;
            return data || [];
        }

        async function renderListings() {
            listingsContainer.replaceChildren();

            try {
                const listings = await fetchActiveListings();

                if (!listings.length) {
                    const empty = document.createElement("p");
                    empty.className = "empty";
                    empty.textContent = "No current job listings saved.";
                    listingsContainer.appendChild(empty);
                    return;
                }

                const jobs = new Map();

                listings.forEach(item => {
                    const job = item.job || "Unspecified job";
                    const country = item.country || "Unspecified country";
                    const region = item.region || "Unspecified region";

                    if (!jobs.has(job)) jobs.set(job, new Map());
                    const countries = jobs.get(job);
                    if (!countries.has(country)) countries.set(country, new Map());
                    const regions = countries.get(country);
                    if (!regions.has(region)) regions.set(region, []);
                    regions.get(region).push(item);
                });

                [...jobs.keys()].sort(compareText).forEach(job => {
                    const jobSection = makeGroup(job, "job-group");
                    const countries = jobs.get(job);

                    [...countries.keys()].sort(compareText).forEach(country => {
                        const countrySection = makeGroup(country, "country-group");
                        const regions = countries.get(country);

                        [...regions.keys()].sort(compareText).forEach(region => {
                            const regionSection = makeGroup(region, "region-group");

                            regions.get(region)
                                .sort((a, b) => compareText(a.address || "", b.address || ""))
                                .forEach(item => {
                                    const card = document.createElement("div");
                                    card.className = "listing";
                                    addDetail(card, "Address", item.address);
                                    addDetail(card, "Contact telephone number", item.telephone);
                                    addDetail(card, "Income / Salary", item.income);
                                    addDetail(card, "Work hours / schedule", item.work_hours);
                                    addDetail(card, "Job description and other details", item.description);
                                    regionSection.appendChild(card);
                                });

                            countrySection.appendChild(regionSection);
                        });

                        jobSection.appendChild(countrySection);
                    });

                    listingsContainer.appendChild(jobSection);
                });
            } catch (error) {
                listingsContainer.textContent =
                    "Could not load listings: " + (error.message || error);
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            if (!jobSelect.value || jobSelect.disabled) {
                setMessage("Select a qualification and a related job.", true);
                return;
            }

            submitButton.disabled = true;
            setMessage("Saving listing…");

            const listing = {
                job: jobSelect.value,
                country: countrySelect.value,
                region: regionSelect.value,
                address: document.getElementById("address").value.trim(),
                telephone: document.getElementById("telephone").value.trim(),
                income: document.getElementById("income").value.trim(),
                work_hours: document.getElementById("work-hours").value.trim(),
                description: document.getElementById("description").value.trim()
            };

            try {
                const { error } = await db.from("job_listings").insert(listing);
                if (error) throw error;

                form.reset();
                resetJobSelect("Choose a degree or diploma first");
                regionSelect.disabled = true;
                regionSelect.replaceChildren(new Option("Choose a country first", ""));

                setMessage("Listing saved. It will stop displaying after 30 days.");
                await renderListings();
            } catch (error) {
                setMessage("Could not save listing: " + error.message, true);
            } finally {
                submitButton.disabled = false;
            }
        });

        populateQualifications();
        renderListings();
    </script>
</body>
</html>
