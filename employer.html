<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Workspace - Postgraduate Careers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }

        form, .job-group, .country-group, .region-group, .listing {
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 18px;
            padding: 10px 16px;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .message {
            color: #216e39;
            min-height: 1.4em;
        }

        .job-group {
            background: #f7f9fc;
        }

        .country-group {
            margin-left: 12px;
            background: #fff;
        }

        .region-group {
            margin-left: 12px;
            background: #fafafa;
        }

        .listing {
            margin-left: 12px;
        }

        .job-group > h3 {
            margin-top: 0;
        }

        .listing p {
            margin: 8px 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .empty {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Employer Workspace</h1>
    <h2>Add a job listing which is stored for a month</h2>

    <form id="job-form">
        <label for="job">Select a job</label>
        <select id="job" required>
            <option value="">Loading jobs…</option>
        </select>

        <label for="country">Country</label>
        <select id="country" required>
            <option value="">Choose a country</option>
        </select>

        <label for="region">Region / State / Province</label>
        <select id="region" required disabled>
            <option value="">Choose a country first</option>
        </select>

        <label for="address">Address</label>
        <input id="address" type="text" required
               placeholder="Enter the workplace address">

        <label for="telephone">Contact telephone number</label>
        <input id="telephone" type="tel" required
               autocomplete="tel"
               placeholder="For example: +1 555 123 4567">

        <label for="income">Income / Salary</label>
        <input id="income" type="text" required
               placeholder="For example: $60,000–$75,000 per year">

        <label for="work-hours">Work hours / schedule</label>
        <input id="work-hours" type="text" required
               placeholder="For example: Monday–Friday, 9:00 AM–5:00 PM">

        <label for="description">Job description and other details</label>
        <textarea id="description" required
                  placeholder="Describe the role, responsibilities, requirements, benefits, and any other details."></textarea>

        <button id="submit-button" type="submit">Save job listing</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

        ];

        const countrySelect = document.getElementById("country");
        const regionSelect = document.getElementById("region");
        const form = document.getElementById("job-form");
        const listingsContainer = document.getElementById("listings");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        function compareText(a, b) {
            return a.localeCompare(b, undefined, {
                sensitivity: "base",
                numeric: true
            });
        }

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "#b42318" : "#216e39";
        }

        function loadJobs() {
            const jobSelect = document.getElementById("job");
            jobSelect.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Choose a job";
            jobSelect.appendChild(placeholder);

            [...new Set(JOBS)].sort(compareText).forEach(job => {
                const option = document.createElement("option");
                option.value = job;
                option.textContent = job;
                jobSelect.appendChild(option);
            });
        }

        function loadCountries() {
            try {
                const displayCountry = new Intl.DisplayNames(["en"], {
                    type: "region"
                });

                const countries = [];

                for (let first = 65; first <= 90; first++) {
                    for (let second = 65; second <= 90; second++) {
                        const code = String.fromCharCode(first, second);
                        const name = displayCountry.of(code);

                        if (name && name !== code && !name.startsWith("Unknown")) {
                            countries.push({ code, name });
                        }
                    }
                }

                countries.sort((a, b) => compareText(a.name, b.name));

                countries.forEach(country => {
                    const option = document.createElement("option");
                    option.value = country.name;
                    option.textContent = country.name;
                    countrySelect.appendChild(option);
                });
            } catch (error) {
                countrySelect.innerHTML =
                    '<option value="">Country list unavailable</option>';
                setMessage("Your browser could not create the country list.", true);
            }
        }

        async function loadRegions(country) {
            regionSelect.disabled = true;
            regionSelect.innerHTML =
                '<option value="">Loading regions…</option>';
            setMessage("");

            try {
                const response = await fetch(
                    "https://countriesnow.space/api/v0.1/countries/states",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ country })
                    }
                );

                if (!response.ok) {
                    throw new Error("Region request failed.");
                }

                const result = await response.json();
                const regions = result.data?.states || [];
                regions.sort((a, b) => compareText(a.name, b.name));

                regionSelect.innerHTML =
                    '<option value="">Choose a region/state/province</option>';

                regions.forEach(region => {
                    const option = document.createElement("option");
                    option.value = region.name;
                    option.textContent = region.name;
                    regionSelect.appendChild(option);
                });

                if (regions.length) {
                    regionSelect.disabled = false;
                } else {
                    regionSelect.innerHTML =
                        '<option value="">No regions available</option>';
                    setMessage("No regions were returned for this country.", true);
                }
            } catch (error) {
                regionSelect.innerHTML =
                    '<option value="">Could not load regions</option>';
                regionSelect.disabled = true;
                setMessage(
                    "Could not load regions. Check your internet connection and try again.",
                    true
                );
            }
        }

        countrySelect.addEventListener("change", () => {
            setMessage("");

            if (countrySelect.value) {
                loadRegions(countrySelect.value);
            } else {
                regionSelect.disabled = true;
                regionSelect.innerHTML =
                    '<option value="">Choose a country first</option>';
            }
        });

        function makeGroup(title, className) {
            const group = document.createElement("section");
            group.className = className;

            const heading = document.createElement("h3");
            heading.textContent = title;
            group.appendChild(heading);

            return group;
        }

        function addListingDetail(container, label, value) {
            const paragraph = document.createElement("p");
            const strong = document.createElement("strong");

            strong.textContent = `${label}: `;
            paragraph.appendChild(strong);
            paragraph.appendChild(
                document.createTextNode(value || "Not provided")
            );

            container.appendChild(paragraph);
        }

        async function fetchActiveListings() {
            const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();

            const { data, error } = await db
                .from("job_listings")
                .select("*")
                .gte("created_at", cutoff)
                .order("job", { ascending: true });

            if (error) throw error;
            return data || [];
        }

        async function renderListings() {
            listingsContainer.replaceChildren();

            try {
                const listings = await fetchActiveListings();

                if (listings.length === 0) {
                    const empty = document.createElement("p");
                    empty.className = "empty";
                    empty.textContent = "No current job listings saved.";
                    listingsContainer.appendChild(empty);
                    return;
                }

                const jobGroups = new Map();

                listings.forEach(listing => {
                    const job = listing.job || "Unspecified job";
                    const country = listing.country || "Unspecified country";
                    const region = listing.region || "Unspecified region";

                    if (!jobGroups.has(job)) jobGroups.set(job, new Map());

                    const countryGroups = jobGroups.get(job);
                    if (!countryGroups.has(country)) {
                        countryGroups.set(country, new Map());
                    }

                    const regionGroups = countryGroups.get(country);
                    if (!regionGroups.has(region)) {
                        regionGroups.set(region, []);
                    }

                    regionGroups.get(region).push(listing);
                });

                [...jobGroups.keys()].sort(compareText).forEach(job => {
                    const jobSection = makeGroup(job, "job-group");
                    const countryGroups = jobGroups.get(job);

                    [...countryGroups.keys()].sort(compareText).forEach(country => {
                        const countrySection = makeGroup(country, "country-group");
                        const regionGroups = countryGroups.get(country);

                        [...regionGroups.keys()].sort(compareText).forEach(region => {
                            const regionSection = makeGroup(region, "region-group");

                            const sortedListings = [...regionGroups.get(region)]
                                .sort((a, b) =>
                                    compareText(a.address || "", b.address || "")
                                );

                            sortedListings.forEach(listing => {
                                const listingElement = document.createElement("div");
                                listingElement.className = "listing";

                                addListingDetail(
                                    listingElement,
                                    "Address",
                                    listing.address || "No address entered"
                                );
                                addListingDetail(
                                    listingElement,
                                    "Contact telephone number",
                                    listing.telephone
                                );
                                addListingDetail(
                                    listingElement,
                                    "Income / Salary",
                                    listing.income
                                );
                                addListingDetail(
                                    listingElement,
                                    "Work hours / schedule",
                                    listing.work_hours
                                );
                                addListingDetail(
                                    listingElement,
                                    "Job description and other details",
                                    listing.description
                                );

                                regionSection.appendChild(listingElement);
                            });

                            countrySection.appendChild(regionSection);
                        });

                        jobSection.appendChild(countrySection);
                    });

                    listingsContainer.appendChild(jobSection);
                });
            } catch (error) {
                listingsContainer.textContent =
                    "Could not load listings: " + error.message;
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            if (!form.reportValidity()) return;

            submitButton.disabled = true;
            setMessage("Saving listing…");

            const listing = {
                job: document.getElementById("job").value,
                country: countrySelect.value,
                region: regionSelect.value,
                address: document.getElementById("address").value.trim(),
                telephone: document.getElementById("telephone").value.trim(),
                income: document.getElementById("income").value.trim(),
                work_hours: document.getElementById("work-hours").value.trim(),
                description: document.getElementById("description").value.trim()
            };

            try {
                const { error } = await db
                    .from("job_listings")
                    .insert(listing);

                if (error) throw error;

                form.reset();
                regionSelect.disabled = true;
                regionSelect.innerHTML =
                    '<option value="">Choose a country first</option>';

                setMessage("Job listing saved. It will no longer display after 30 days.");
                await renderListings();
            } catch (error) {
                setMessage("Could not save listing: " + error.message, true);
            } finally {
                submitButton.disabled = false;
            }
        });

        loadJobs();
        loadCountries();
        renderListings();
    </script>
