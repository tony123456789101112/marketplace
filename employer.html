<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employer Workspace</title>

    <style>
        :root { color-scheme: dark; }

        body {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            color: #fff;
            background: #111;
        }

        form, .job-group, .country-group, .region-group, .listing {
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #1b1b1b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #fff;
        }

        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #777;
            border-radius: 4px;
            color: #fff !important;
            background-color: #000 !important;
            font: inherit;
            caret-color: #fff;
        }

        input::placeholder, textarea::placeholder {
            color: #bbb;
            opacity: 1;
        }

        select option, datalist option {
            color: #fff;
            background-color: #000;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #81b5ff;
            outline-offset: 1px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            padding: 11px 17px;
            margin-top: 18px;
            border: 1px solid #888;
            border-radius: 4px;
            color: #fff;
            background: #333;
            cursor: pointer;
        }

        button:hover { background: #484848; }
        button:disabled { cursor: wait; opacity: .6; }

        .hint, .empty { color: #ccc; }

        .hint {
            margin: 6px 0 0;
            font-size: .9rem;
        }

        .message {
            min-height: 1.4em;
            color: #8fe0a3;
        }

        .job-group { background: #202630; }
        .country-group { margin-left: 12px; background: #191919; }
        .region-group { margin-left: 12px; background: #222; }
        .listing { margin-left: 12px; }
        .job-group > h3 { margin-top: 0; }

        .listing p {
            margin: 8px 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Employer Workspace</h1>
    <h2>Add a job listing which is stored for a month</h2>

    <form id="job-form">
        <label for="qualification-search">Degree or diploma</label>
        <input
            id="qualification-search"
            type="text"
            list="qualification-options"
            autocomplete="off"
            placeholder="Type to search degrees or diplomas"
            required
        >
        <datalist id="qualification-options"></datalist>
        <p class="hint">Type to search and select a qualification suggestion.</p>

        <label for="job">Related job</label>
        <select id="job" required disabled>
            <option value="">Choose a degree or diploma first</option>
        </select>

        <label for="country">Country</label>
        <select id="country" required>
            <option value="">Choose a country</option>
        </select>

        <label for="region">Region / State / Province</label>
        <select id="region" required disabled>
            <option value="">Choose a country first</option>
        </select>

        <label for="address">Address</label>
        <input id="address" type="text" required
               placeholder="Enter the workplace address">

        <label for="telephone">Contact telephone number</label>
        <input id="telephone" type="tel" required autocomplete="tel"
               placeholder="For example: +1 555 123 4567">

        <label for="income">Income / Salary</label>
        <input id="income" type="text" required
               placeholder="For example: $60,000–$75,000 per year">

        <label for="work-hours">Work hours / schedule</label>
        <input id="work-hours" type="text" required
               placeholder="For example: Monday–Friday, 9:00 AM–5:00 PM">

        <label for="description">Job description and other details</label>
        <textarea id="description" required
                  placeholder="Describe the role, responsibilities, requirements, benefits, and other details."></textarea>

        <button id="submit-button" type="submit">Save job listing</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <h2>Saved Listings — Alphabetical Groups</h2>
    <div id="listings"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";

        const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

        /*

            ],

            ],

            ],
            "Mathematics": [

                "Data Analyst",

                "Quantitative Analyst (graduate)",
                "Mathematics Research Assistant"
            ],
            "Environmental Science": [
                "Graduate Environmental Consultant",
                "Environmental Monitoring Assistant",
                "Graduate Environmental Scientist",
                "Sustainability Assistant"
            ],
            "Geography": [
                "GIS Technician",
                "Graduate GIS Analyst",
                "Planning Assistant",
                "Geospatial Data Analyst"
            ],
            "Social Work": [
                "Newly Qualified Social Worker",
                "Assessed and Supported Year in Employment (ASYE) Social Worker",
                "Social Work Assistant"
            ]
            /* Paste all remaining entries from your original DEGREE_JOBS
               object above this closing brace. */
        };

        const qualificationNames = Object.keys(DEGREE_JOBS).sort(compareText);

        const qualificationSearch = document.getElementById("qualification-search");
        const qualificationOptions = document.getElementById("qualification-options");
        const jobSelect = document.getElementById("job");
        const countrySelect = document.getElementById("country");
        const regionSelect = document.getElementById("region");
        const form = document.getElementById("job-form");
        const listingsContainer = document.getElementById("listings");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        function compareText(a, b) {
            return String(a).localeCompare(String(b), undefined, {
                sensitivity: "base",
                numeric: true
            });
        }

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "#ff9292" : "#8fe0a3";
        }

        function resetJobSelect(placeholderText) {
            jobSelect.replaceChildren();
            const option = document.createElement("option");
            option.value = "";
            option.textContent = placeholderText;
            jobSelect.appendChild(option);
            jobSelect.disabled = true;
        }

        function populateQualifications() {
            qualificationOptions.replaceChildren();
            qualificationNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                qualificationOptions.appendChild(option);
            });
        }

        function loadRelatedJobs(qualification) {
            const jobs = DEGREE_JOBS[qualification] || [];
            resetJobSelect(jobs.length
                ? "Choose a related job"
                : "No matching jobs found");

            jobs.forEach(title => {
                const option = document.createElement("option");
                option.value = title;
                option.textContent = title;
                jobSelect.appendChild(option);
            });

            jobSelect.disabled = jobs.length === 0;
            setMessage(jobs.length ? "" : "No jobs are listed for that qualification.", !jobs.length);
        }

        qualificationSearch.addEventListener("input", () => {
            const typed = qualificationSearch.value.trim();
            resetJobSelect(typed
                ? "Select a suggested qualification first"
                : "Choose a degree or diploma first");

            if (!typed) {
                setMessage("");
                return;
            }

            const match = qualificationNames.find(name =>
                name.toLocaleLowerCase() === typed.toLocaleLowerCase()
            );

            if (match) loadRelatedJobs(match);
            else setMessage("");
        });

        function loadCountries() {
            const countries = [
                { value: "United Kingdom", label: "UK" },
                { value: "Germany", label: "Germany" },
                { value: "Singapore", label: "Singapore" },
                { value: "United States", label: "America" },
                { value: "Denmark", label: "Denmark" },
                { value: "Italy", label: "Italy" },
                { value: "Norway", label: "Norway" }
            ].sort((a, b) => compareText(a.label, b.label));

            countries.forEach(country => {
                const option = document.createElement("option");
                option.value = country.value;
                option.textContent = country.label;
                countrySelect.appendChild(option);
            });
        }

        async function loadRegions(country) {
            regionSelect.disabled = true;
            regionSelect.innerHTML = '<option value="">Loading regions…</option>';
            setMessage("");

            try {
                const response = await fetch(
                    "https://countriesnow.space/api/v0.1/countries/states",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ country })
                    }
                );

                if (!response.ok) throw new Error("Region request failed.");

                const result = await response.json();
                const regions = result.data?.states || [];
                regions.sort((a, b) => compareText(a.name, b.name));

                regionSelect.innerHTML =
                    '<option value="">Choose a region/state/province</option>';

                regions.forEach(region => {
                    const option = document.createElement("option");
                    option.value = region.name;
                    option.textContent = region.name;
                    regionSelect.appendChild(option);
                });

                if (regions.length) {
                    regionSelect.disabled = false;
                } else {
                    regionSelect.innerHTML =
                        '<option value="">No regions available</option>';
                    setMessage("No regions were returned for this country.", true);
                }
            } catch {
                regionSelect.innerHTML =
                    '<option value="">Could not load regions</option>';
                regionSelect.disabled = true;
                setMessage("Could not load regions. Check your connection and try again.", true);
            }
        }

        countrySelect.addEventListener("change", () => {
            if (countrySelect.value) {
                loadRegions(countrySelect.value);
            } else {
                regionSelect.disabled = true;
                regionSelect.innerHTML =
                    '<option value="">Choose a country first</option>';
                setMessage("");
            }
        });

        function makeGroup(title, className) {
            const section = document.createElement("section");
            section.className = className;
            const heading = document.createElement("h3");
            heading.textContent = title;
            section.appendChild(heading);
            return section;
        }

        function addListingDetail(container, label, value) {
            const paragraph = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = label + ": ";
            paragraph.appendChild(strong);
            paragraph.appendChild(document.createTextNode(value || "Not provided"));
            container.appendChild(paragraph);
        }

        async function deleteExpiredListings() {
            const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();

            // This deletion requires suitable Supabase DELETE permissions/RLS policy.
            const { error } = await db
                .from("job_listings")
                .delete()
                .lt("created_at", cutoff);

            if (error) {
                console.warn("Expired listings could not be deleted:", error.message);
            }
        }

        async function fetchActiveListings() {
            const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();

            const { data, error } = await db
                .from("job_listings")
                .select("*")
                .gte("created_at", cutoff)
                .order("job", { ascending: true });

            if (error) throw error;
            return data || [];
        }

        async function renderListings() {
            listingsContainer.replaceChildren();

            try {
                const listings = await fetchActiveListings();

                if (!listings.length) {
                    const empty = document.createElement("p");
                    empty.className = "empty";
                    empty.textContent = "No current job listings saved.";
                    listingsContainer.appendChild(empty);
                    return;
                }

                const jobGroups = new Map();

                listings.forEach(listing => {
                    const job = listing.job || "Unspecified job";
                    const country = listing.country || "Unspecified country";
                    const region = listing.region || "Unspecified region";

                    if (!jobGroups.has(job)) jobGroups.set(job, new Map());
                    const countryGroups = jobGroups.get(job);

                    if (!countryGroups.has(country)) countryGroups.set(country, new Map());
                    const regionGroups = countryGroups.get(country);

                    if (!regionGroups.has(region)) regionGroups.set(region, []);
                    regionGroups.get(region).push(listing);
                });

                [...jobGroups.keys()].sort(compareText).forEach(job => {
                    const jobSection = makeGroup(job, "job-group");
                    const countryGroups = jobGroups.get(job);

                    [...countryGroups.keys()].sort(compareText).forEach(country => {
                        const countrySection = makeGroup(country, "country-group");
                        const regionGroups = countryGroups.get(country);

                        [...regionGroups.keys()].sort(compareText).forEach(region => {
                            const regionSection = makeGroup(region, "region-group");

                            regionGroups.get(region)
                                .slice()
                                .sort((a, b) => compareText(a.address || "", b.address || ""))
                                .forEach(listing => {
                                    const element = document.createElement("div");
                                    element.className = "listing";

                                    addListingDetail(element, "Address", listing.address || "No address entered");
                                    addListingDetail(element, "Contact telephone number", listing.telephone);
                                    addListingDetail(element, "Income / Salary", listing.income);
                                    addListingDetail(element, "Work hours / schedule", listing.work_hours);
                                    addListingDetail(element, "Job description and other details", listing.description);

                                    regionSection.appendChild(element);
                                });

                            countrySection.appendChild(regionSection);
                        });

                        jobSection.appendChild(countrySection);
                    });

                    listingsContainer.appendChild(jobSection);
                });
            } catch (error) {
                listingsContainer.textContent = "Could not load listings: " + error.message;
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            if (jobSelect.disabled || !jobSelect.value) {
                setMessage("Select a qualification and a related job.", true);
                return;
            }

            submitButton.disabled = true;
            setMessage("Saving listing…");

            const listing = {
                job: jobSelect.value,
                country: countrySelect.value,
                region: regionSelect.value,
                address: document.getElementById("address").value.trim(),
                telephone: document.getElementById("telephone").value.trim(),
                income: document.getElementById("income").value.trim(),
                work_hours: document.getElementById("work-hours").value.trim(),
                description: document.getElementById("description").value.trim()
            };

            try {
                const { error } = await db.from("job_listings").insert(listing);
                if (error) throw error;

                form.reset();
                resetJobSelect("Choose a degree or diploma first");
                regionSelect.disabled = true;
                regionSelect.innerHTML =
                    '<option value="">Choose a country first</option>';

                setMessage("Job listing saved. It will no longer display after 30 days.");
                await renderListings();
            } catch (error) {
                setMessage("Could not save listing: " + error.message, true);
            } finally {
                submitButton.disabled = false;
            }
        });

        async function init() {
            populateQualifications();
            loadCountries();

            // Best-effort cleanup whenever this page is opened.
            await deleteExpiredListings();
            await renderListings();
        }

        init();
    </script>

</html>
