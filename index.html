<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hindson Marketplace</title>
    <meta
        name="description"
        content="Explore job opportunities, connect with entrepreneurs, and discover shops on Hindson Marketplace."
    >
    <link
        rel="canonical"
        href="https://tony123456789101112.github.io/marketplace/"
    >

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-card {
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 420px;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            color: #222;
        }

        .intro {
            margin: 0 0 25px;
            color: #555;
            line-height: 1.5;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 4px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            box-sizing: border-box;
        }

        .action-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <main class="form-card">
        <h1>Hindson Marketplace</h1>

        <p class="intro">
            Find jobs worldwide, connect with entrepreneurs, and discover
            physical shops online.
        </p>

        <a class="action-btn" href="dashboard.html">
            Are you ready to explore the worldwide marketplace?
        </a>
    </main>
</body>
</html>
