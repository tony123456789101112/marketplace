<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Access</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .form-card {
      background: white;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
      width: 360px;
      max-width: 100%;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 25px;
      text-align: center;
      color: #222;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: 0;
      border-radius: 4px;
      background: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:hover { background: #0056b3; }
    .register-mode-btn { background: #28a745; }
    .register-mode-btn:hover { background: #218838; }
    .action-btn:disabled { opacity: .65; cursor: wait; }

    .toggle-link {
      margin-top: 20px;
      color: #007bff;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }

    .status-msg {
      min-height: 20px;
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h2 id="form-title">Sign in to get started</h2>

    <form id="auth-form">
      <input
        type="text"
        id="username"
        class="input-box"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="email"
        id="email"
        class="input-box"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        class="input-box"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="primary-btn" class="action-btn" type="submit">Sign In</button>
    </form>

    <div id="toggle-text" class="toggle-link" role="button" tabindex="0">
      Don't have an account? Create new user
    </div>

    <p id="status-display" class="status-msg" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with your values from Supabase → Project Settings → API.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let isRegisterMode = false;

    const form = document.getElementById("auth-form");
    const title = document.getElementById("form-title");
    const button = document.getElementById("primary-btn");
    const toggleText = document.getElementById("toggle-text");
    const message = document.getElementById("status-display");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
    }

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      message.textContent = "";

      if (isRegisterMode) {
        title.textContent = "Create New User";
        button.textContent = "Register Account";
        button.className = "action-btn register-mode-btn";
        toggleText.textContent = "Already have an account? Sign in";
        passwordInput.autocomplete = "new-password";
      } else {
        title.textContent = "Sign in to get started";
        button.textContent = "Sign In";
        button.className = "action-btn";
        toggleText.textContent = "Don't have an account? Create new user";
        passwordInput.autocomplete = "current-password";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!username || !email || !password) {
        showMessage("Please fill in all fields.", "red");
        return;
      }

      button.disabled = true;
      showMessage("Please wait…", "#555");

      try {
        if (isRegisterMode) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { username }
            }
          });

          if (error) throw error;

          if (!data.user) {
            throw new Error("Signup returned no user. Check your Supabase Auth settings.");
          }

          if (data.session) {
            const { error: profileError } = await supabase
              .from("profiles")
              .upsert(
                { id: data.user.id, username },
                { onConflict: "id" }
              );

            if (profileError) {
              throw new Error(
                "Account created, but saving the profile failed: " +
                profileError.message
              );
            }

            showMessage("Account created. You can now sign in.", "green");
          } else {
            showMessage(
              "Account created. Check your email to confirm it, then sign in.",
              "green"
            );
          }

          setTimeout(() => {
            if (isRegisterMode) toggleMode();
          }, 1800);
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          const savedUsername =
            username || data.user.user_metadata?.username || email;

          const { error: profileError } = await supabase
            .from("profiles")
            .upsert(
              { id: data.user.id, username: savedUsername },
              { onConflict: "id" }
            );

          if (profileError) {
            throw new Error(
              "Signed in, but saving the profile failed: " +
              profileError.message
            );
          }

          showMessage("Login successful. Redirecting…", "green");
          setTimeout(() => {
            window.location.href = "users.html";
          }, 700);
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong.", "red");
      } finally {
        button.disabled = false;
      }
    });

    toggleText.addEventListener("click", toggleMode);

    toggleText.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleMode();
      }
    });
  </script>
</body>
</html>
