<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Access</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .form-card {
      background: white;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
      width: 340px;
      max-width: 100%;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 25px;
      text-align: center;
      color: #222;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: 0;
      border-radius: 4px;
      background: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:hover { background: #0056b3; }
    .register-mode-btn { background: #28a745; }
    .register-mode-btn:hover { background: #218838; }
    .action-btn:disabled { opacity: .65; cursor: wait; }

    .toggle-link {
      margin-top: 20px;
      color: #007bff;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }

    .status-msg {
      min-height: 20px;
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h2 id="form-title">
      Finding jobs with or without a degree worldwide? Sign in to find one!
    </h2>

    <form id="auth-form">
      <input
        type="text"
        id="username"
        class="input-box"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        class="input-box"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="primary-btn" class="action-btn" type="submit">
        Sign In
      </button>
    </form>

    <div id="toggle-text" class="toggle-link" role="button" tabindex="0">
      Don't have an account? Create new user
    </div>

    <p id="status-display" class="status-msg" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with your actual values from Supabase → Project Settings → API.
    const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let isRegisterMode = false;

    const form = document.getElementById("auth-form");
    const title = document.getElementById("form-title");
    const button = document.getElementById("primary-btn");
    const toggleText = document.getElementById("toggle-text");
    const message = document.getElementById("status-display");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
    }

    // Demo workaround: Supabase password auth requires an email.
    // Use real email addresses for a production site.
    function usernameToEmail(username) {
      const cleanUsername = username.trim().toLowerCase();

      if (!/^[a-z0-9._-]{3,30}$/.test(cleanUsername)) {
        throw new Error(
          "Username must be 3–30 characters: letters, numbers, dots, underscores, or hyphens."
        );
      }

      return `${cleanUsername}@users.example.com`;
    }

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      message.textContent = "";

      if (isRegisterMode) {
        title.textContent = "Create New User";
        button.textContent = "Register Account";
        button.className = "action-btn register-mode-btn";
        toggleText.textContent = "Already have an account? Sign in";
        passwordInput.autocomplete = "new-password";
      } else {
        title.textContent =
          "Finding jobs with or without a degree worldwide? Sign in to find one!";
        button.textContent = "Sign In";
        button.className = "action-btn";
        toggleText.textContent = "Don't have an account? Create new user";
        passwordInput.autocomplete = "current-password";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showMessage("Enter both a username and password.", "red");
        return;
      }

      button.disabled = true;
      showMessage("Please wait…", "#555");

      try {
        const email = usernameToEmail(username);

        if (isRegisterMode) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { username }
            }
          });

          if (error) throw error;

          if (!data.user) {
            throw new Error("Supabase did not return a user.");
          }

          if (!data.session) {
            showMessage(
              "Supabase requires email confirmation. This username-only demo uses a placeholder email, so switch off email confirmation in Supabase or use real email addresses.",
              "red"
            );
            return;
          }

          showMessage("Account created. You can now sign in.", "green");

          setTimeout(() => {
            if (isRegisterMode) toggleMode();
          }, 1200);
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage("Login successful. Redirecting…", "green");

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 500);
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong.", "red");
      } finally {
        button.disabled = false;
      }
    });

    toggleText.addEventListener("click", toggleMode);

    toggleText.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleMode();
      }
    });
  </script>
</body>
</html>
