<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Map Pins</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px 20px;
      color: #333;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 8px;
    }

    .pin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #ddd;
    }

    .pin-details { overflow-wrap: anywhere; }

    .pin-details p {
      margin: 5px 0;
      color: #555;
    }

    .pin-photo {
      display: block;
      max-width: 100px;
      max-height: 70px;
      margin-top: 8px;
      object-fit: cover;
    }

    button {
      flex-shrink: 0;
      padding: 9px 13px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover { background: #b02a37; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.5em; }

    @media (max-width: 500px) {
      .pin-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Manage Map Pins</h1>
    <p id="status" role="status" aria-live="polite">Loading pins…</p>
    <div id="pins"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const pinsContainer = document.getElementById("pins");
    const status = document.getElementById("status");

    async function loadPins() {
      status.textContent = "Loading pins…";
      pinsContainer.replaceChildren();

      const { data, error } = await db
        .from("product_pins")
        .select("id,lat,lng,title,description,photo_url,created_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Could not load pins: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = "No saved pins found.";
        return;
      }

      status.textContent = "";

      for (const pin of data) {
        const row = document.createElement("div");
        row.className = "pin-row";

        const details = document.createElement("div");
        details.className = "pin-details";

        const title = document.createElement("strong");
        title.textContent = pin.title || "Untitled pin";
        details.appendChild(title);

        const description = document.createElement("p");
        description.textContent = pin.description || "No additional information.";
        details.appendChild(description);

        const lat = Number(pin.lat);
        const lng = Number(pin.lng);
        const location = document.createElement("p");
        location.textContent = Number.isFinite(lat) && Number.isFinite(lng)
          ? `Location: ${lat.toFixed(5)}, ${lng.toFixed(5)}`
          : "Location unavailable";
        details.appendChild(location);

        if (pin.photo_url) {
          const image = document.createElement("img");
          image.src = pin.photo_url;
          image.alt = pin.title ? `Photo of ${pin.title}` : "Pin photo";
          image.className = "pin-photo";
          details.appendChild(image);
        }

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete pin";

        deleteButton.addEventListener("click", async () => {
          if (!confirm(`Delete the pin "${pin.title || "Untitled pin"}"?`)) {
            return;
          }

          deleteButton.disabled = true;

          const { data: deleted, error: deleteError } = await db
            .from("product_pins")
            .delete()
            .eq("id", pin.id)
            .select("id");

          if (deleteError) {
            status.textContent = "Could not delete pin: " + deleteError.message;
            deleteButton.disabled = false;
            return;
          }

          if (!deleted || deleted.length === 0) {
            status.textContent =
              "No pin was deleted. Check the table's id column and Supabase DELETE policy.";
            deleteButton.disabled = false;
            return;
          }

          status.textContent = "Pin deleted.";
          await loadPins();
        });

        row.append(details, deleteButton);
        pinsContainer.appendChild(row);
      }
    }

    loadPins();
  </script>
</body>
</html>
