<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Available Jobs</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
      color: #f5f5f5;
      background: #0b0d10;
      line-height: 1.5;
    }

    h1, h2, h3, p {
      overflow-wrap: anywhere;
    }

    .search-panel,
    .job-group,
    .country-group,
    .region-group,
    .listing {
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid #343a43;
      border-radius: 10px;
      background: #15191f;
    }

    .search-panel {
      background: #171d25;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 16px;
    }

    .filter {
      min-width: 0;
    }

    .filter-wide {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      margin-top: 5px;
      border: 1px solid #626b79;
      border-radius: 6px;
      color: #fff;
      background: #080a0d;
      font: inherit;
    }

    input::placeholder {
      color: #aeb7c3;
      opacity: 1;
    }

    select option,
    datalist option {
      color: #fff;
      background: #080a0d;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid #83b7ff;
      outline-offset: 2px;
    }

    button {
      width: auto;
      padding: 10px 16px;
      border-color: #507bb5;
      background: #234b7b;
      cursor: pointer;
    }

    button:hover {
      background: #30639c;
    }

    .hint,
    .empty,
    #result-count {
      color: #c4ccd6;
    }

    .hint {
      margin: 6px 0 0;
      font-size: .92rem;
    }

    #result-count {
      margin-bottom: 0;
      font-weight: 700;
    }

    .job-group {
      background: #1b2634;
    }

    .job-group > h2 {
      margin-top: 0;
    }

    .country-group {
      margin-left: 12px;
      background: #15191f;
    }

    .region-group {
      margin-left: 12px;
      background: #101318;
    }

    .listing {
      margin-left: 12px;
      background: #0d1014;
    }

    .listing p {
      margin: 8px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .listing p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 650px) {
      body {
        margin: 20px auto;
        padding: 0 14px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-wide {
        grid-column: auto;
      }

      .country-group,
      .region-group,
      .listing {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Employee Workspace</h1>
    <h2>Find available jobs</h2>
    <p>Search by job title, qualification, country, or region.</p>
  </header>

  <section class="search-panel" aria-label="Job search filters">
    <div class="filter-grid">
      <div class="filter filter-wide">
        <label for="job-search">Search job title</label>
        <input
          id="job-search"
          type="search"
          placeholder="Try nurse, designer, engineer…"
          autocomplete="off"
        >
      </div>

      <div class="filter">
        <label for="qualification-search">Degree or diploma (optional)</label>
        <input
          id="qualification-search"
          type="text"
          list="qualification-options"
          autocomplete="off"
          placeholder="Type to search qualifications"
        >
        <datalist id="qualification-options"></datalist>
        <p class="hint">Choose a suggested qualification to see related jobs.</p>
      </div>

      <div class="filter">
        <label for="related-job-search">Related job (optional)</label>
        <select id="related-job-search" disabled>
          <option value="">Choose a qualification first</option>
        </select>
      </div>

      <div class="filter">
        <label for="country-search">Country</label>
        <select id="country-search">
          <option value="">All countries</option>
        </select>
      </div>

      <div class="filter">
        <label for="region-search">Region / State / Province</label>
        <select id="region-search" disabled>
          <option value="">Choose a country first</option>
        </select>
      </div>

      <div class="filter filter-wide">
        <button id="clear-filters" type="button">Clear filters</button>
        <p id="result-count" aria-live="polite">Loading listings…</p>
      </div>
    </div>
  </section>

  <main id="listings" aria-live="polite">Loading listings…</main>

  <!-- Load the shared qualification/job data before the page script. -->
  <script src="degree-jobs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const qualificationInput =
      document.getElementById("qualification-search");
    const qualificationOptions =
      document.getElementById("qualification-options");
    const jobSearch =
      document.getElementById("job-search");
    const relatedJobSelect =
      document.getElementById("related-job-search");
    const countrySelect =
      document.getElementById("country-search");
    const regionSelect =
      document.getElementById("region-search");
    const listingsContainer =
      document.getElementById("listings");
    const resultCount =
      document.getElementById("result-count");
    const clearFiltersButton =
      document.getElementById("clear-filters");

    const degreeJobs = window.DEGREE_JOBS || {};
    const qualificationNames = Object.keys(degreeJobs).sort(compareText);

    let allListings = [];

    function compareText(a, b) {
      return String(a || "").localeCompare(String(b || ""), undefined, {
        sensitivity: "base",
        numeric: true
      });
    }

    function normalize(value) {
      return String(value || "").trim().toLocaleLowerCase();
    }

    function getSelectedQualification() {
      const typed = normalize(qualificationInput.value);

      return qualificationNames.find(
        name => normalize(name) === typed
      ) || "";
    }

    function populateQualificationOptions() {
      qualificationOptions.replaceChildren();

      for (const name of qualificationNames) {
        const option = document.createElement("option");
        option.value = name;
        qualificationOptions.appendChild(option);
      }
    }

    function resetRelatedJobSelect(placeholder) {
      relatedJobSelect.replaceChildren();

      const option = document.createElement("option");
      option.value = "";
      option.textContent = placeholder;
      relatedJobSelect.appendChild(option);

      relatedJobSelect.disabled = true;
    }

    function populateRelatedJobs(qualification) {
      const jobs = [
        ...new Set(degreeJobs[qualification] || [])
      ].sort(compareText);

      resetRelatedJobSelect(
        jobs.length ? "All related jobs" : "No related jobs found"
      );

      for (const title of jobs) {
        const option = document.createElement("option");
        option.value = title;
        option.textContent = title;
        relatedJobSelect.appendChild(option);
      }

      relatedJobSelect.disabled = jobs.length === 0;
    }

    function populateCountries() {
      const countries = [
        ...new Set(
          allListings
            .map(listing => listing.country)
            .filter(Boolean)
        )
      ].sort(compareText);

      countrySelect.replaceChildren();

      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = "All countries";
      countrySelect.appendChild(allOption);

      for (const country of countries) {
        const option = document.createElement("option");
        option.value = country;
        option.textContent = country;
        countrySelect.appendChild(option);
      }
    }

    function populateRegions(country) {
      regionSelect.replaceChildren();

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = country
        ? "All regions / states / provinces"
        : "Choose a country first";
      regionSelect.appendChild(defaultOption);

      if (!country) {
        regionSelect.disabled = true;
        return;
      }

      const regions = [
        ...new Set(
          allListings
            .filter(listing =>
              normalize(listing.country) === normalize(country)
            )
            .map(listing => listing.region)
            .filter(Boolean)
        )
      ].sort(compareText);

      for (const region of regions) {
        const option = document.createElement("option");
        option.value = region;
        option.textContent = region;
        regionSelect.appendChild(option);
      }

      regionSelect.disabled = false;
    }

    function matchesFilters(listing) {
      const typedJob = normalize(jobSearch.value);
      const qualification = getSelectedQualification();
      const selectedRelatedJob = relatedJobSelect.value;
      const selectedCountry = countrySelect.value;
      const selectedRegion = regionSelect.value;

      if (
        typedJob &&
        !normalize(listing.job).includes(typedJob)
      ) {
        return false;
      }

      // If a qualification is typed but no suggestion is selected,
      // don't silently show misleading results.
      if (qualificationInput.value.trim() && !qualification) {
        return false;
      }

      if (qualification) {
        const qualificationJobs = degreeJobs[qualification] || [];
        const jobsToMatch = selectedRelatedJob
          ? [selectedRelatedJob]
          : qualificationJobs;

        if (!jobsToMatch.some(
          title => normalize(title) === normalize(listing.job)
        )) {
          return false;
        }
      }

      if (
        selectedCountry &&
        normalize(listing.country) !== normalize(selectedCountry)
      ) {
        return false;
      }

      if (
        selectedRegion &&
        normalize(listing.region) !== normalize(selectedRegion)
      ) {
        return false;
      }

      return true;
    }

    function makeGroup(title, className, headingTag = "h3") {
      const section = document.createElement("section");
      section.className = className;

      const heading = document.createElement(headingTag);
      heading.textContent = title;
      section.appendChild(heading);

      return section;
    }

    function addDetail(container, label, value) {
      const paragraph = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = label + ": ";
      paragraph.append(
        strong,
        document.createTextNode(value || "Not provided")
      );
      container.appendChild(paragraph);
    }

    function renderListings() {
      const filtered = allListings.filter(matchesFilters);
      listingsContainer.replaceChildren();

      resultCount.textContent =
        `${filtered.length} ${filtered.length === 1 ? "listing" : "listings"} found`;

      if (!filtered.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = allListings.length
          ? "No listings match your filters. Try changing or clearing them."
          : "No current job listings are available.";
        listingsContainer.appendChild(empty);
        return;
      }

      const jobs = new Map();

      for (const item of filtered) {
        const job = item.job || "Unspecified job";
        const country = item.country || "Unspecified country";
        const region = item.region || "Unspecified region";

        if (!jobs.has(job)) jobs.set(job, new Map());

        const countries = jobs.get(job);
        if (!countries.has(country)) countries.set(country, new Map());

        const regions = countries.get(country);
        if (!regions.has(region)) regions.set(region, []);

        regions.get(region).push(item);
      }

      for (const job of [...jobs.keys()].sort(compareText)) {
        const jobSection = makeGroup(job, "job-group", "h2");
        const countries = jobs.get(job);

        for (const country of [...countries.keys()].sort(compareText)) {
          const countrySection = makeGroup(country, "country-group");
          const regions = countries.get(country);

          for (const region of [...regions.keys()].sort(compareText)) {
            const regionSection = makeGroup(region, "region-group");
            const sortedListings = [...regions.get(region)].sort(
              (a, b) => compareText(a.address, b.address)
            );

            for (const item of sortedListings) {
              const article = document.createElement("article");
              article.className = "listing";

              addDetail(article, "Address", item.address);
              addDetail(article, "Telephone", item.telephone);
              addDetail(article, "Income / Salary", item.income);
              addDetail(article, "Work hours / schedule", item.work_hours);
              addDetail(article, "Description", item.description);

              regionSection.appendChild(article);
            }

            countrySection.appendChild(regionSection);
          }

          jobSection.appendChild(countrySection);
        }

        listingsContainer.appendChild(jobSection);
      }
    }

    async function loadListings() {
      const cutoff = new Date(
        Date.now() - THIRTY_DAYS_MS
      ).toISOString();

      const { data, error } = await db
        .from("job_listings")
        .select(
          "job,country,region,address,telephone,income,work_hours,description,created_at"
        )
        .gte("created_at", cutoff);

      if (error) throw error;

      allListings = data || [];
      populateCountries();
      populateRegions(countrySelect.value);
    }

    qualificationInput.addEventListener("input", () => {
      const qualification = getSelectedQualification();

      if (qualification) {
        populateRelatedJobs(qualification);
      } else {
        resetRelatedJobSelect(
          qualificationInput.value.trim()
            ? "Choose a suggested qualification first"
            : "Choose a qualification first"
        );
      }

      renderListings();
    });

    jobSearch.addEventListener("input", renderListings);
    relatedJobSelect.addEventListener("change", renderListings);

    countrySelect.addEventListener("change", () => {
      populateRegions(countrySelect.value);
      renderListings();
    });

    regionSelect.addEventListener("change", renderListings);

    clearFiltersButton.addEventListener("click", () => {
      jobSearch.value = "";
      qualificationInput.value = "";
      countrySelect.value = "";

      resetRelatedJobSelect("Choose a qualification first");
      populateRegions("");
      renderListings();

      jobSearch.focus();
    });

    async function start() {
      try {
        if (!Object.keys(degreeJobs).length) {
          throw new Error(
            "Could not load degree-jobs.js. Check that it is beside this HTML file and defines window.DEGREE_JOBS."
          );
        }

        resultCount.textContent = "Loading qualifications and listings…";
        populateQualificationOptions();
        resetRelatedJobSelect("Choose a qualification first");

        await loadListings();
        renderListings();
      } catch (error) {
        resultCount.textContent = "Could not load the job search.";
        listingsContainer.textContent = error.message;
      }
    }

    start();
  </script>
</body>
</html>
