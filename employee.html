<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Available Jobs</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
    .job-group, .country-group, .region-group, .listing { padding: 20px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 8px; }
    .job-group { background: #f7f9fc; }
    .country-group, .region-group, .listing { margin-left: 12px; }
    .country-group { background: #fff; }
    .region-group { background: #fafafa; }
    .listing p { margin: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .empty { color: #666; }
  </style>
</head>
<body>
  <h1>Employee Workspace</h1>
  <h2>Available jobs — alphabetical groups</h2>
  <div id="listings" aria-live="polite">Loading listings…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const listingsContainer = document.getElementById("listings");
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

    function compareText(a, b) {
      return a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
    }

    function makeGroup(title, className, headingTag = "h3") {
      const section = document.createElement("section");
      section.className = className;
      const heading = document.createElement(headingTag);
      heading.textContent = title;
      section.appendChild(heading);
      return section;
    }

    function addDetail(container, label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;
      p.append(strong, document.createTextNode(value || "Not provided"));
      container.appendChild(p);
    }

    async function renderListings() {
      listingsContainer.textContent = "Loading listings…";

      const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();
      const { data, error } = await db
        .from("job_listings")
        .select("job,country,region,address,telephone,income,work_hours,description,created_at")
        .gte("created_at", cutoff);

      if (error) {
        listingsContainer.textContent = "Could not load listings: " + error.message;
        return;
      }

      const listings = data || [];
      listingsContainer.replaceChildren();

      if (!listings.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No current job listings are available.";
        listingsContainer.appendChild(empty);
        return;
      }

      const jobs = new Map();
      for (const item of listings) {
        const job = item.job || "Unspecified job";
        const country = item.country || "Unspecified country";
        const region = item.region || "Unspecified region";

        if (!jobs.has(job)) jobs.set(job, new Map());
        const countries = jobs.get(job);
        if (!countries.has(country)) countries.set(country, new Map());
        const regions = countries.get(country);
        if (!regions.has(region)) regions.set(region, []);
        regions.get(region).push(item);
      }

      for (const job of [...jobs.keys()].sort(compareText)) {
        const jobSection = makeGroup(job, "job-group", "h2");
        const countries = jobs.get(job);

        for (const country of [...countries.keys()].sort(compareText)) {
          const countrySection = makeGroup(country, "country-group");
          const regions = countries.get(country);

          for (const region of [...regions.keys()].sort(compareText)) {
            const regionSection = makeGroup(region, "region-group");

            const sorted = regions.get(region).sort((a, b) =>
              compareText(a.address || "", b.address || "")
            );

            for (const item of sorted) {
              const article = document.createElement("article");
              article.className = "listing";
              addDetail(article, "Address", item.address);
              addDetail(article, "Telephone", item.telephone);
              addDetail(article, "Income / Salary", item.income);
              addDetail(article, "Work hours / schedule", item.work_hours);
              addDetail(article, "Description", item.description);
              regionSection.appendChild(article);
            }

            countrySection.appendChild(regionSection);
          }
          jobSection.appendChild(countrySection);
        }
        listingsContainer.appendChild(jobSection);
      }
    }

    renderListings();
  </script>
</body>
</html>
