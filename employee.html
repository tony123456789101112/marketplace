<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Available Jobs</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }

    .search-panel,
    .job-group,
    .country-group,
    .region-group,
    .listing {
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .search-panel {
      background: #f7f9fc;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input,
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font: inherit;
    }

    .job-group { background: #f7f9fc; }
    .country-group, .region-group, .listing { margin-left: 12px; }
    .country-group { background: #fff; }
    .region-group { background: #fafafa; }

    .listing p {
      margin: 8px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .hint, .empty, .status {
      color: #666;
    }

    .hint { font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Employee Workspace</h1>
  <h2>Find available jobs</h2>

  <section class="search-panel">
    <label for="qualification-search">Search by degree or diploma</label>
    <input
      id="qualification-search"
      type="text"
      list="qualification-options"
      autocomplete="off"
      placeholder="Type a degree or diploma"
    >
    <datalist id="qualification-options"></datalist>
    <p class="hint">Choose a qualification suggestion to see related jobs.</p>

    <label for="job-search">Then choose a related job</label>
    <select id="job-search" disabled>
      <option value="">Choose a degree or diploma first</option>
    </select>

    <p id="status" class="status" aria-live="polite"></p>
  </section>

  <h2>Matching listings</h2>
  <div id="listings" aria-live="polite">Loading listings…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ywtydlllmzzazsskajoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R9bF_XIkE_ei2CaiTZfzbw_o2oyu8eb";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

    /*
     * Keep the same DEGREE_JOBS object from your employer page here.
     * Paste the complete object contents between the braces.
     */
    const DEGREE_JOBS = {
      "Fine Art": [
        "Studio Assistant",
        "Artist’s Assistant",
        "Gallery Assistant",
        "Arts Programme Assistant",
        "Community Arts Assistant",
        "Trainee Conservator"
      ],
      "Graphic Design": [
        "Junior Graphic Designer",
        "Trainee Graphic Designer",
        "Graphic Design Assistant",
        "Junior Brand Designer",
        "Production Artist",
        "Junior Digital Designer"
      ],
      "Illustration & Animation": [
        "Junior Illustrator",
        "Trainee Animator",
        "Junior 2D/3D Animator",
        "Storyboard Assistant",
        "Animation Production Assistant",
        "Junior Motion Graphics Designer"
      ],
      "Accounting / Finance Bachelor's": ["Accountant"],
      "Business Administration / Finance Bachelor's": ["Acquisition Specialist"],
      "Actuarial Science / Mathematics Bachelor's": ["Actuary"],
      "Computer Science / Artificial Intelligence Ph.D.": ["AI Research Scientist"],
      "Bachelor or Master of Architecture + Licensure": ["Architect"],
      "Graphic Design / Fine Arts BFA": ["Graphic Designer"],
      "Bachelor of Science in Nursing - BSN, or ADN + Board Licensure": [
        "Registered Nurse (RN)"
      ]
    };

    const qualificationNames = Object.keys(DEGREE_JOBS).sort(compareText);
    const qualificationSearch = document.getElementById("qualification-search");
    const qualificationOptions = document.getElementById("qualification-options");
    const jobSearch = document.getElementById("job-search");
    const listingsContainer = document.getElementById("listings");
    const status = document.getElementById("status");

    let activeListings = [];

    function compareText(a, b) {
      return a.localeCompare(b, undefined, {
        sensitivity: "base",
        numeric: true
      });
    }

    function populateQualifications() {
      qualificationNames.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        qualificationOptions.appendChild(option);
      });
    }

    function resetJobSearch(message) {
      jobSearch.replaceChildren();
      const option = document.createElement("option");
      option.value = "";
      option.textContent = message;
      jobSearch.appendChild(option);
      jobSearch.disabled = true;
    }

    function showRelatedJobs(qualification) {
      const relatedJobs = DEGREE_JOBS[qualification] || [];

      resetJobSearch(
        relatedJobs.length
          ? "Choose a related job"
          : "No related jobs found"
      );

      relatedJobs
        .slice()
        .sort(compareText)
        .forEach(job => {
          const option = document.createElement("option");
          option.value = job;
          option.textContent = job;
          jobSearch.appendChild(option);
        });

      jobSearch.disabled = relatedJobs.length === 0;

      if (relatedJobs.length) {
        status.textContent = "Now choose a job to see matching listings.";
      } else {
        status.textContent = "No jobs are listed for that qualification.";
      }
    }

    qualificationSearch.addEventListener("input", () => {
      const typed = qualificationSearch.value.trim();

      resetJobSearch(
        typed
          ? "Select an exact qualification suggestion"
          : "Choose a degree or diploma first"
      );

      if (!typed) {
        status.textContent = "";
        listingsContainer.textContent = "Choose a qualification and job to search.";
        return;
      }

      const match = qualificationNames.find(
        name => name.toLocaleLowerCase() === typed.toLocaleLowerCase()
      );

      if (match) {
        showRelatedJobs(match);
      } else {
        status.textContent = "";
        listingsContainer.textContent =
          "Select a qualification from the suggestions to continue.";
      }
    });

    jobSearch.addEventListener("change", () => {
      renderListings();
    });

    function makeGroup(title, className, headingTag = "h3") {
      const section = document.createElement("section");
      section.className = className;

      const heading = document.createElement(headingTag);
      heading.textContent = title;
      section.appendChild(heading);

      return section;
    }

    function addDetail(container, label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = label + ": ";
      p.append(strong, document.createTextNode(value || "Not provided"));
      container.appendChild(p);
    }

    async function loadListings() {
      const cutoff = new Date(Date.now() - THIRTY_DAYS_MS).toISOString();

      const { data, error } = await db
        .from("job_listings")
        .select("job,qualification,country,region,address,telephone,income,work_hours,description,created_at")
        .gte("created_at", cutoff);

      if (error) throw error;
      return data || [];
    }

    function renderListings() {
      const selectedJob = jobSearch.value;

      if (!selectedJob) {
        listingsContainer.textContent =
          "Choose a qualification and related job to see matching listings.";
        return;
      }

      const matches = activeListings.filter(listing =>
        (listing.job || "").toLocaleLowerCase() ===
        selectedJob.toLocaleLowerCase()
      );

      listingsContainer.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No current listings found for this job.";
        listingsContainer.appendChild(empty);
        return;
      }

      const jobs = new Map();

      for (const item of matches) {
        const job = item.job || "Unspecified job";
        const country = item.country || "Unspecified country";
        const region = item.region || "Unspecified region";

        if (!jobs.has(job)) jobs.set(job, new Map());
        const countries = jobs.get(job);

        if (!countries.has(country)) countries.set(country, new Map());
        const regions = countries.get(country);

        if (!regions.has(region)) regions.set(region, []);
        regions.get(region).push(item);
      }

      for (const job of [...jobs.keys()].sort(compareText)) {
        const jobSection = makeGroup(job, "job-group", "h2");
        const countries = jobs.get(job);

        for (const country of [...countries.keys()].sort(compareText)) {
          const countrySection = makeGroup(country, "country-group");
          const regions = countries.get(country);

          for (const region of [...regions.keys()].sort(compareText)) {
            const regionSection = makeGroup(region, "region-group");
            const sortedListings = regions.get(region).slice().sort((a, b) =>
              compareText(a.address || "", b.address || "")
            );

            for (const item of sortedListings) {
              const article = document.createElement("article");
              article.className = "listing";

              addDetail(article, "Address", item.address);
              addDetail(article, "Telephone", item.telephone);
              addDetail(article, "Income / Salary", item.income);
              addDetail(article, "Work hours / schedule", item.work_hours);
              addDetail(article, "Description", item.description);

              regionSection.appendChild(article);
            }

            countrySection.appendChild(regionSection);
          }

          jobSection.appendChild(countrySection);
        }

        listingsContainer.appendChild(jobSection);
      }
    }

    async function initialize() {
      populateQualifications();

      try {
        listingsContainer.textContent = "Loading listings…";
        activeListings = await loadListings();
        listingsContainer.textContent =
          "Choose a qualification and related job to see matching listings.";
      } catch (error) {
        listingsContainer.textContent =
          "Could not load listings: " + error.message;
      }
    }

    initialize();
  </script>
</body>
</html>
