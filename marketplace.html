<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #333;
        }
        .marketplace-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 { color: #28a745; }
        .btn-container {
            display: flex;
            gap: 15px;
        }
        .marketplace-btn {
            flex: 1;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .advertise-btn { background: #007bff; }
        .browse-btn { background: #28a745; }

        @media (max-width: 420px) {
            .btn-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="marketplace-card">
        <h1>Marketplace</h1>
        <p>Choose what you would like to do.</p>

        <div class="btn-container">
            <a href="marketput.html" class="marketplace-btn advertise-btn">
                Advertising Your Product worldwide
            </a>
            <a href="markets.html" class="marketplace-btn browse-btn">
                Browse Physical Shops
            </a>
        </div>
    </main>
</body>
</html>
