<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Team</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #333;
            padding: 20px;
        }

        .management-card {
            box-sizing: border-box;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            color: #28a745;
            margin: 0 0 15px;
        }

        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .button-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button-link {
            box-sizing: border-box;
            flex: 1 1 120px;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .users-button {
            background: #007bff;
        }

        .manage-button {
            background: #6f42c1;
        }

        .market-pin-button {
            background: #17a2b8;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #555;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="management-card">
        <h1>Management Team</h1>
        <p>Select a management page to continue.</p>

        <div class="button-container">
            <a href="users.html" class="button-link users-button">Users</a>

            <a href="manage.html" class="button-link manage-button">
                Manage Jobs
            </a>

            <a href="pin.html" class="button-link market-pin-button">
                Market Pin
            </a>
        </div>

        <a href="dashboard.html" class="back-link">Back to dashboard</a>
    </main>
</body>
</html>
